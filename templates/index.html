<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aryan AI | Advanced Voice Intelligence</title>
    <meta name="description" content="Aryan AI - Advanced AI Voice Assistant created by Aryan Jha. Powered by Pollinations AI for seamless conversational experience.">
    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="dark-theme">
    <!-- Dynamic Background Layer -->
    <div id="particles-js"></div>
    <div class="aura-container">
        <div class="aura-blob aura-blob-1"></div>
        <div class="aura-blob aura-blob-2"></div>
    </div>

    <header>
        <div class="logo">
            <div class="logo-icon-wrapper">
                <img src="/static/icons/icon-192.png" alt="Aryan AI Logo" id="app-logo">
            </div>
            <h1>Aryan AI</h1>
        </div>
        <div class="header-controls">
            <button class="header-btn" id="theme-toggle" title="Switch Theme">
                <i class="fas fa-moon"></i>
            </button>
            <button class="header-btn" id="settings-btn" title="AI Settings">
                <i class="fas fa-sliders-h"></i>
            </button>
        </div>
    </header>

    <main>
        <div class="chat-wrapper" id="chat-history">
            <!-- Welcome Message -->
            <div class="message assistant">
                <div class="msg-content">
                    Greetings! I am <strong style="color: var(--primary);">Aryan AI</strong>, your sophisticated voice companion <strong style="font-weight: 600;">developed by Aryan Jha</strong>. How may I assist you this today?
                </div>
                <div class="msg-meta">
                    <i class="fas fa-sparkles"></i> Just now
                </div>
            </div>
        </div>

        <!-- Dynamic Typing Indicator (Hidden by default) -->
        <div id="typing-indicator" class="typing-indicator" style="display: none; margin-bottom: 20px;">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <div class="action-box">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Ask anything to Aryan AI..." autocomplete="off">
                <button class="send-btn" id="send-btn" title="Send (Enter)">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
            <div class="voice-section">
                <div class="mic-wrapper">
                    <button class="mic-btn" id="mic-btn" title="Click to Speak">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <div class="mic-ring" id="mic-ring"></div>
                </div>
                <div class="status-label" id="status-text">Aryan AI is ready.</div>
            </div>
        </div>
    </main>

    <footer class="foot-note">
        Crafted with <i class="fas fa-heart" style="color: #ef4444; font-size: 10px;"></i> by <a href="#" target="_blank">Aryan Jha</a> &copy; 2026
    </footer>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; font-family: var(--font-ui);">Assistant Settings</h2>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Voice Speed</span>
                    <input type="range" min="0.5" max="2" step="0.1" value="1" id="voice-rate" style="accent-color: var(--primary);">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>AI Intensity</span>
                    <i class="fas fa-bolt text-accent" style="color: var(--accent);"></i>
                </div>
                <button id="close-settings" class="header-btn" style="width: 100%; height: 45px; margin-top: 10px;">Apply & Save</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="/static/js/script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Voice SW Active');
                }).catch(err => {
                    console.log('Offline Fail: ', err);
                });
            });
        }
    </script>
</body>
</html>
